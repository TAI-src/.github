on:
  workflow_call:

jobs:
  format:
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository and create PR
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Black
        run: pip install black

      - name: Format Python code with Black
        id: black
        run: |
          black . -t py37 -t py312

          if git diff --quiet; then
            echo "is_formatted=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_formatted=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.black.outputs.is_formatted == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "${{ env.BRANCH_NAME }} Format Python code with psf/black push"
          commit-message: ":art: Format Python code with psf/black"
          body: |
            There appear to be some python formatting errors in ${{ github.sha }}.
            This pull request uses the [psf/black](https://github.com/psf/black)
            formatter to fix these issues.
          base: ${{ github.head_ref }}
          branch: black/${{ env.BRANCH_NAME }}

      - name: Fail job if not formatted
        if: steps.black.outputs.is_formatted == 'true'
        run: |
          echo "Needs formatting. Merge black PR"
          exit 1
